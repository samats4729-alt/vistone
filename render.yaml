# Размещение на render.com: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: vistone
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: vistone-data
      mountPath: /var/data
      sizeGB: 1
